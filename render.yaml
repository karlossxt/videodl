# Blueprint de Render: crea el servicio web a partir del Dockerfile.
# En https://dashboard.render.com -> New -> Blueprint, apunta a este repositorio.
services:
  - type: web
    name: videodl
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Render inyecta PORT automáticamente. La URL pública (canonical, Open Graph,
    # sitemap.xml, robots.txt y datos estructurados) es https://fastools.org por
    # defecto; para staging u otro dominio define SITE_URL (sin barra final).
    # Estas variables son opcionales (sync: false = se editan en el panel).
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: X264_PRESET
        value: veryfast
      - key: CLIP_MAX_SECONDS
        value: "300"
      # El plan gratuito tiene 0.1 CPU: varias codificaciones a la vez se
      # estorban entre ellas y disparan los tiempos. 2 es un equilibrio
      # razonable; con 1 la cola se alarga demasiado.
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # Marca visible. El dominio canónico se configura por separado en SITE_URL.
      # La marca pública predeterminada es Fastools.
      - key: SITE_NAME
        sync: false
