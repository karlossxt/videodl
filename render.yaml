# Blueprint de Render: crea el servicio web a partir del Dockerfile.
# En https://dashboard.render.com -> New -> Blueprint, apunta a este repositorio.
services:
  - type: web
    name: videodl
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Render inyecta PORT y RENDER_EXTERNAL_URL automáticamente. La URL pública
    # se usa para canonical, Open Graph, sitemap.xml y robots.txt; si quieres
    # forzar otro dominio, define SITE_URL (sin barra final).
    # Estas variables son opcionales (sync: false = se editan en el panel).
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: X264_PRESET
        value: veryfast
      - key: CLIP_MAX_SECONDS
        value: "300"
      # El plan gratuito tiene 0.1 CPU: varias codificaciones a la vez se
      # estorban entre ellas y disparan los tiempos. 2 es un equilibrio
      # razonable; con 1 la cola se alarga demasiado.
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # Marca visible. Si usas otro dominio, define aquí FasTools.es (o el
      # nombre elegido). Render inyecta RENDER_EXTERNAL_URL para SITE_URL.
      - key: SITE_NAME
        sync: false
