name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests del motor de imagen (Node)
        run: node --test tests/image-tools.test.js

      - name: Tests del núcleo PDF (Node)
        run: node --test tests/pdf-tools.test.js

      - name: Tests del núcleo QR (Node)
        run: node --test tests/qr-core.test.js

      - name: Tests (pytest)
        run: pytest

      - name: Instalar dependencias E2E
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (Playwright)
        run: npm run test:e2e

  docker:
    # Comprueba que la imagen de producción se construye y arranca de verdad.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t videodl:ci .

      - name: Arrancar y comprobar /api/health
        run: |
          docker run -d --name videodl -p 8000:8000 videodl:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "El contenedor no respondió a tiempo"
            docker logs videodl
            exit 1
          fi
          echo "Servicio sano:"
          curl -fsS http://127.0.0.1:8000/api/health
          echo

      - name: Parar el contenedor
        if: always()
        run: docker rm -f videodl || true
